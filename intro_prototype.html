<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLIMATE · Intro Oficial, Equipo (1–7), Prototipo & Impacto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            space: {
              950: '#040814',
              900: '#091124',
              850: '#0D1730',
              800: '#13203E',
              700: '#1E3159'
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body class="min-h-screen bg-space-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
  <noscript>
    <div class="max-w-lg mx-auto mt-16 p-6 rounded-2xl border border-cyan-500/40 bg-space-900 text-center">
      <h1 class="text-lg font-bold text-white mb-2">CLIMATE · Showcase Interactivo</h1>
      <p class="text-sm text-slate-300">Activa JavaScript para visualizar la presentación del equipo (1–7), el prototipo en video y el demo guiado.</p>
    </div>
  </noscript>

  <script src="intro-showcase.js"></script>
  <script>
    (function () {
      let savedTheme = 'dark';
      let savedLang = 'es';
      try {
        savedTheme = localStorage.getItem('quimili_theme') || 'dark';
        savedLang = localStorage.getItem('quimili_lang') || 'es';
      } catch (e) {}

      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
      }
      document.documentElement.lang = savedLang === 'en' ? 'en' : 'es';

      if (window.ClimateIntroShowcase && typeof window.ClimateIntroShowcase.init === 'function') {
        window.ClimateIntroShowcase.init({
          standalone: true,
          autoOpen: true,
          language: savedLang === 'en' ? 'en' : 'es'
        });
      }
      if (window.lucide) {
        window.lucide.createIcons();
      }
    })();
  </script>
</body>
</html>
